# Builds the Mac app on a Mac (GitHub's macOS runner), so nobody needs Rust or
# Xcode locally. Run it from Actions → "Mac app" → Run workflow. With
# "release" on, the .dmg is attached to the "app-latest" release.
name: Mac app
on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the build to the app-latest release
        type: boolean
        default: true
      runner:
        description: Which Mac builds it (Intel runs on Apple Silicon through Rosetta; use it when Apple Silicon machines are busy)
        type: choice
        options: [macos-latest, macos-15-intel]
        default: macos-latest
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }} # Apple Silicon unless Intel is picked
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the app's packages
        working-directory: desktop
        run: npm ci

      # With Quest Space's Apple Developer ID in the repository secrets, the
      # app is signed and notarized (opens without a warning); without them
      # it's signed ad hoc. See docs/DEPLOY.md → "Signing and notarizing".
      - name: Build the app
        working-directory: desktop
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ -n "$SECRET_APPLE_CERTIFICATE" ] && [ -n "$SECRET_APPLE_SIGNING_IDENTITY" ]; then
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY"
            node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));delete c.bundle.macOS.signingIdentity;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_PASSWORD="$SECRET_APPLE_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
              echo "::notice title=Signing::Developer ID, notarized"
            else
              echo "::notice title=Signing::Developer ID, not notarized (APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID missing)"
            fi
          else
            echo "::notice title=Signing::ad hoc (no Apple Developer ID secrets yet)"
          fi
          npm run tauri build -- --bundles app,dmg 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Build logs aren't always easy to reach: put the end of a failed build,
      # and the warnings of a good one, where the run's summary shows them.
      - name: Report the build
        if: always()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          enc() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          if grep -q "Finished" "$log" && [ -d desktop/src-tauri/target/release/bundle/macos/cutecaptain.app ]; then
            echo "::notice title=Rust warnings::$(grep -A6 '^warning' "$log" | head -80 | enc)"
          else
            echo "::error title=Build output::$(grep -v '^\s*Compiling ' "$log" | tail -n 70 | enc)"
          fi

      - name: Build the Chrome extension
        working-directory: desktop
        run: npm run build:extension

      - name: Collect the files
        id: files
        run: |
          set -e
          out="$RUNNER_TEMP/captain"
          mkdir -p "$out"
          (cd desktop/dist-extension && zip -qr "$out/cutecaptain-Chrome-extension.zip" .)
          bundle=desktop/src-tauri/target/release/bundle
          app="$bundle/macos/cutecaptain.app"
          test -f "$app/Contents/Resources/server/dist/src/main.js" || { echo "::error::The built-in server is missing from the app"; exit 1; }
          ditto -c -k --keepParent "$app" "$out/cutecaptain-mac.zip"
          cp "$bundle"/dmg/*.dmg "$out/cutecaptain.dmg"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier" || true
          echo "::notice title=Sizes::app $(du -sh "$app" | cut -f1), dmg $(du -h "$out/cutecaptain.dmg" | cut -f1), zip $(du -h "$out/cutecaptain-mac.zip" | cut -f1)"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cutecaptain-mac
          path: ${{ steps.files.outputs.dir }}
          retention-days: 14

      - name: Attach to the app-latest release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest --prerelease --target "$GITHUB_SHA" \
            --title "cutecaptain for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Mac: download cutecaptain.dmg, open it, and drag cutecaptain to Applications. If it isn't notarized yet, right-click cutecaptain and choose Open the first time. Chrome: unzip cutecaptain-Chrome-extension.zip, open chrome://extensions, turn on Developer mode, and choose Load unpacked." \
            "${{ steps.files.outputs.dir }}/cutecaptain.dmg" "${{ steps.files.outputs.dir }}/cutecaptain-mac.zip" "${{ steps.files.outputs.dir }}/cutecaptain-Chrome-extension.zip"
