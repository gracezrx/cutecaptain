# On-demand agent: mention @claude in an issue or PR comment and it picks the
# thread up — answer a question, fix a review comment, take an issue to a PR.
# Same gates and skills as the night shift; same rule that a person merges.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/captain_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/captain_e2e
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json
      - name: Install everything the gates need
        run: |
          psql postgres://postgres@localhost:5432/postgres -c 'create database captain_test' -c 'create database captain_e2e'
          (cd server && npm ci)
          (cd desktop && npm ci && npx playwright install --with-deps chromium && npm run build)
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          claude_args: |
            --max-turns 60
            --max-budget-usd 6
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gh *),Bash(npm *),Bash(npx *),Bash(node *),Bash(psql *),Bash(cat *),Bash(ls *),Bash(mkdir *),Bash(cd *),Bash(E2E_SERVER_LOG=* *),Bash(PLAYWRIGHT_* *)"
            --append-system-prompt "Read CLAUDE.md first. Use the bugfix and prove skills. Every change needs evidence from the real product (e2e spec + screenshot, or a server test). Run all gates before pushing. Never merge; a person does that."
