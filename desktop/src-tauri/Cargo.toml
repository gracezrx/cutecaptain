[package]
name = "cutecaptain"
version = "0.1.0"
description = "cutecaptain: a lightweight Mac app for Captain group chats"
edition = "2021"
publish = false

[lib]
name = "captain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
mac-notification-sys = "0.6"

[profile.release]
# Small, fast binary: this app is meant to stay light.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
