<!doctype html>
<!-- A made-up sign-in page: Captain must never type into the password field. -->
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body style="font: 14px system-ui; padding: 40px">
  <form onsubmit="event.preventDefault(); document.title = 'Signed in';">
    <label>Email <input name="email" type="email" autocomplete="username"></label><br><br>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label><br><br>
    <button>Sign in</button>
  </form>
</body></html>
